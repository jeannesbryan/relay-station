name: CI

# WHY THIS EXISTS
# ------------------------------------------------------------------
# The suite in tests/ already had real assertions, but nothing ran it. The
# v8.0.1 regression (a button that did nothing) and the three fatal 500s fixed
# in v8.0.3 were both reachable only by actually exercising the code - no
# linter and no amount of reading could see them. This runs the checks on
# every push so that class of defect is caught before it reaches a node.
#
# The lint job is deliberately separate from the test job: "this file does not
# parse" and "this file parses but misbehaves" are different failures and
# should not be reported as one.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, curl, mbstring
          coverage: none

      - name: Syntax check every PHP file
        run: |
          set -e
          fail=0
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            if ! php -l "$f" > /dev/null 2>&1; then
              echo "::error file=$f::PHP syntax error"
              php -l "$f" || true
              fail=1
            fi
          done < <(find . -name '*.php' -not -path './.git/*')
          echo "Checked $count PHP files."
          exit $fail

  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, curl, mbstring
          coverage: none

      # Each suite exits non-zero on failure, so a failing step stops the job.
      # Order: static checks first (fast, no runtime), then the suites that
      # actually load the application.
      - name: Markup checks (nested forms, form owners)
        run: php tests/markup_test.php

      - name: Security checks
        run: php tests/security_test.php

      - name: Hygiene shield checks
        run: php tests/shield_test.php

      - name: Media handling checks
        run: php tests/media_test.php

      - name: Radar sweep checks (unreachable peers, grace period)
        run: php tests/radar_test.php

      # Added in v8.1. The shared render layer is the single place the Timeline,
      # the Vault and the landing page now agree on, so its behaviour - and the
      # escaping of remote-supplied values - is pinned here rather than in three
      # template reviews.
      - name: Shared render layer checks (labels, media, buttons)
        run: php tests/render_test.php

      - name: Store-and-forward outbox checks
        run: php tests/outbox_test.php

      - name: Smoke test (every entry point loads without a fatal)
        run: php tests/smoke_test.php

      - name: Confirm the test run left no database behind
        run: |
          if [ -f data/relay_core.sqlite ]; then
            echo "::error::a test wrote to data/relay_core.sqlite; tests must use RELAY_DB_FILE"
            exit 1
          fi
          echo "data/ is clean."
